# Deploy Kettu plugin to GitHub Pages
name: Deploy Kettu Plugin

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Prepare Pages site
        run: |
          mkdir -p site/dm-collections

          cp dist/dm-collections/index.js site/dm-collections/
          cp dist/dm-collections/manifest.json site/dm-collections/

          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Kettu Plugins</title>
          </head>
          <body>
            <h1>Kettu Plugins</h1>
            <p>DM Collections</p>
            <a href="dm-collections/">DM Collections</a>
          </body>
          </html>
          EOF

          cat > site/dm-collections/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>DM Collections</title>
          </head>
          <body>
            <h1>DM Collections</h1>
            <p>Kettu plugin files:</p>
            <ul>
              <li><a href="manifest.json">manifest.json</a></li>
              <li><a href="index.js">index.js</a></li>
            </ul>
          </body>
          </html>
          EOF
          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
